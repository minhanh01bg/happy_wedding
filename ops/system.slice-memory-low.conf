# /etc/systemd/system/system.slice.d/50-happy-wedding-memory-low.conf,
# installed from ops/ as root (docs/OPERATIONS.md, "systemd system unit").
#
# The kernel honours a cgroup's memory.low only up to what each parent cgroup
# is given. system.slice has 0 by default, which makes MemoryLow= in
# happy-wedding.service ineffective. This gives system.slice the same 256M,
# and the unit claims all of it. Remove this file (and daemon-reload) to undo.
[Slice]
MemoryLow=256M
